<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sobre Mim</title>

    <style>

        /* ============================= */
        /* CONFIGURAÇÃO GERAL             */
        /* ============================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    #8b5cf6,
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    #06b6d4,
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #050816,
                    #111827
                );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;

            overflow-x: hidden;
        }


        /* ============================= */
        /* CARTÃO PRINCIPAL               */
        /* ============================= */

        .card {
            width: 100%;
            max-width: 600px;

            padding: 45px 40px;

            text-align: center;

            background: rgba(255, 255, 255, 0.10);

            border: 1px solid rgba(255, 255, 255, 0.20);

            border-radius: 30px;

            backdrop-filter: blur(20px);

            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.55);

            animation: aparecer 0.8s ease;
        }


        /* ============================= */
        /* CÍRCULO DA FOTO                */
        /* ============================= */

        .foto-container {
            width: 160px;
            height: 160px;

            margin: 0 auto 25px;

            padding: 5px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #ec4899,
                    #06b6d4
                );

            box-shadow:
                0 10px 40px rgba(168, 85, 247, 0.55);
        }


        .foto {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            border-radius: 50%;

            border: 4px solid #111827;
        }


        /* ============================= */
        /* TÍTULO                         */
        /* ============================= */

        h1 {
            font-size: 36px;

            margin-bottom: 25px;

            color: white;

            text-shadow:
                0 0 20px rgba(168, 85, 247, 0.4);
        }


        /* ============================= */
        /* CAIXA SOBRE MIM                */
        /* ============================= */

        .sobre-mim {
            text-align: left;

            padding: 25px;

            margin-bottom: 25px;

            border-radius: 20px;

            background: rgba(0, 0, 0, 0.22);

            border: 1px solid rgba(255, 255, 255, 0.15);

            box-shadow:
                inset 0 0 30px rgba(255, 255, 255, 0.03);
        }


        .sobre-mim h2 {
            color: #d8b4fe;

            font-size: 23px;

            margin-bottom: 15px;
        }


        .sobre-mim p {
            color: #dbeafe;

            font-size: 16px;

            line-height: 1.8;
        }


        .sobre-mim strong {
            color: #c084fc;
        }


        /* ============================= */
        /* BOTÃO                          */
        /* ============================= */

        .botao {
            width: 100%;

            padding: 19px;

            border: none;

            border-radius: 17px;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            position: relative;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #a855f7,
                    #ec4899
                );

            box-shadow:
                0 10px 30px rgba(168, 85, 247, 0.45);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                filter 0.25s ease;
        }


        /* ============================= */
        /* MOUSE EM CIMA                  */
        /* ============================= */

        .botao:hover {
            transform: scale(1.07) translateY(-3px);

            filter: brightness(1.2);

            box-shadow:
                0 18px 45px rgba(236, 72, 153, 0.65);
        }


        /* ============================= */
        /* CLIQUE                         */
        /* ============================= */

        .botao:active {
            transform: scale(0.96);
        }


        /* ============================= */
        /* BRILHO DO BOTÃO                */
        /* ============================= */

        .botao::before {
            content: "";

            position: absolute;

            top: 0;

            left: -120%;

            width: 70%;

            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 255, 255, 0.55),
                    transparent
                );

            transform: skewX(-25deg);

            transition: 0.7s;
        }


        .botao:hover::before {
            left: 130%;
        }


        /* ============================= */
        /* ANIMAÇÃO DA PÁGINA             */
        /* ============================= */

        @keyframes aparecer {

            from {
                opacity: 0;

                transform:
                    translateY(40px)
                    scale(0.92);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }


        /* ============================= */
        /* CELULAR                        */
        /* ============================= */

        @media (max-width: 600px) {

            body {
                padding: 20px;
            }

            .card {
                padding: 35px 22px;
            }

            .foto-container {
                width: 135px;
                height: 135px;
            }

            h1 {
                font-size: 29px;
            }

            .sobre-mim {
                padding: 20px;
            }

            .sobre-mim p {
                font-size: 15px;
            }

        }

    </style>

</head>


<body>


    <div class="card">


        <!-- ========================= -->
        <!-- FOTO                       -->
        <!-- ========================= -->

        <div class="foto-container">

            <img
                class="foto"
                src="https://media.tenor.com/Yx0HhPpsj9QAAAAe/teto-plush.png"
                alt="Minha foto">

        </div>


        <!-- ========================= -->
        <!-- TÍTULO                     -->
        <!-- ========================= -->

        <h1>
            grande imperador do universo conhecido:
        </h1>


        <!-- ========================= -->
        <!-- TEXTO                      -->
        <!-- ========================= -->

        <div class="sobre-mim">

            <h2>
                
            </h2>

            <p>

                Meu nome é
                <strong>Gustavo P Huve</strong>.

                <br><br>

                gosto de bolo e chá
                <br><br>

                eu gosto de desenhar e fazer pintura digital (tradicional é mt cara de sustentar)

                <br><br>

                <strong>
                    Este texto é totalmente editável.
                </strong>

            </p>

        </div>


        <!-- ========================= -->
        <!-- BOTÃO                      -->
        <!-- ========================= -->

        <button
            class="botao"
            onclick="window.location.href='index.html'">

            ← Voltar

        </button>


    </div>


</body>

</html>
